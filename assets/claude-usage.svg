<svg xmlns="http://www.w3.org/2000/svg" width="520" height="304" viewBox="0 0 520 304" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs>
  <radialGradient id="glow" cx="0.18" cy="0.12" r="0.9">
    <stop offset="0" stop-color="#2a1a5c" stop-opacity="0.75"/>
    <stop offset="0.5" stop-color="#160c33" stop-opacity="0.35"/>
    <stop offset="1" stop-color="#000000" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0" stop-color="#6d49e8"/>
    <stop offset="1" stop-color="#c9a6ff"/>
  </linearGradient>
  <linearGradient id="peak" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0" stop-color="#8a5cff"/>
    <stop offset="1" stop-color="#e6d6ff"/>
  </linearGradient>
  <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="card"><rect x="1" y="1" width="518" height="302" rx="18"/></clipPath>
</defs>

<rect x="1" y="1" width="518" height="302" rx="18" fill="#000000" stroke="#2a2342" stroke-width="1.5"/>
<rect x="1" y="1" width="518" height="302" fill="url(#glow)" clip-path="url(#card)"/>

<!-- header -->
<text x="26" y="42" font-size="21" font-weight="700" fill="#ffffff">⚡ Work Horse: Claude Opus</text>
<text x="26" y="63" font-size="11.5" fill="#8a7fb0" letter-spacing="0.3">Across 4 GPU hosts  ·  6-month window</text>
<rect x="26" y="74" width="468" height="1" fill="#ffffff" opacity="0.08"/>

<!-- stat tiles -->
<text x="84"  y="112" font-size="23" font-weight="800" fill="#efe6ff" text-anchor="middle">389</text>
<text x="84"  y="130" font-size="10.5" fill="#7d73a3" text-anchor="middle" letter-spacing="0.4">SESSIONS</text>
<text x="202" y="112" font-size="23" font-weight="800" fill="#efe6ff" text-anchor="middle">177.78K</text>
<text x="202" y="130" font-size="10.5" fill="#7d73a3" text-anchor="middle" letter-spacing="0.4">MESSAGES</text>
<text x="318" y="112" font-size="23" font-weight="800" fill="#efe6ff" text-anchor="middle">15.26B</text>
<text x="318" y="130" font-size="10.5" fill="#7d73a3" text-anchor="middle" letter-spacing="0.4">TOKENS</text>
<text x="436" y="112" font-size="23" font-weight="800" fill="#efe6ff" text-anchor="middle">36.84K</text>
<text x="436" y="130" font-size="10.5" fill="#7d73a3" text-anchor="middle" letter-spacing="0.4">TOOL CALLS</text>
<rect x="143" y="98" width="1" height="30" fill="#ffffff" opacity="0.07"/>
<rect x="260" y="98" width="1" height="30" fill="#ffffff" opacity="0.07"/>
<rect x="377" y="98" width="1" height="30" fill="#ffffff" opacity="0.07"/>

<!-- chart -->
<text x="26" y="162" font-size="12.5" fill="#8a7fb0">Monthly messages — the ramp</text>

<!-- gridlines -->
<rect x="40" y="252" width="440" height="1" fill="#ffffff" opacity="0.14"/>
<rect x="40" y="222" width="440" height="1" fill="#ffffff" opacity="0.05"/>
<rect x="40" y="192" width="440" height="1" fill="#ffffff" opacity="0.05"/>
<rect x="40" y="162" width="440" height="1" fill="#ffffff" opacity="0.05"/>

<!-- bars (baseline y=252, max 122px @ 90K) -->
<g>
  <rect x="54.7"  y="250.0" width="44" height="2.0"  rx="2.5" fill="url(#bar)"><animate attributeName="height" from="0" to="2.0"  dur="0.9s" fill="freeze"/><animate attributeName="y" from="252" to="250.0" dur="0.9s" fill="freeze"/></rect>
  <rect x="128.0" y="245.2" width="44" height="6.8"  rx="2.5" fill="url(#bar)"><animate attributeName="height" from="0" to="6.8"  dur="0.9s" fill="freeze"/><animate attributeName="y" from="252" to="245.2" dur="0.9s" fill="freeze"/></rect>
  <rect x="201.3" y="238.4" width="44" height="13.6" rx="2.5" fill="url(#bar)"><animate attributeName="height" from="0" to="13.6" dur="0.9s" fill="freeze"/><animate attributeName="y" from="252" to="238.4" dur="0.9s" fill="freeze"/></rect>
  <rect x="274.7" y="230.3" width="44" height="21.7" rx="2.5" fill="url(#bar)"><animate attributeName="height" from="0" to="21.7" dur="0.9s" fill="freeze"/><animate attributeName="y" from="252" to="230.3" dur="0.9s" fill="freeze"/></rect>
  <rect x="348.0" y="130.0" width="44" height="122.0" rx="2.5" fill="url(#peak)" filter="url(#soft)"><animate attributeName="height" from="0" to="122.0" dur="0.9s" fill="freeze"/><animate attributeName="y" from="252" to="130.0" dur="0.9s" fill="freeze"/></rect>
  <rect x="421.3" y="176.1" width="44" height="75.9" rx="2.5" fill="url(#bar)"><animate attributeName="height" from="0" to="75.9" dur="0.9s" fill="freeze"/><animate attributeName="y" from="252" to="176.1" dur="0.9s" fill="freeze"/></rect>
</g>

<!-- value labels -->
<text x="76.7"  y="244.0" font-size="9.5" fill="#b5a7e0" text-anchor="middle">834</text>
<text x="150.0" y="239.2" font-size="9.5" fill="#b5a7e0" text-anchor="middle">5K</text>
<text x="223.3" y="232.4" font-size="9.5" fill="#b5a7e0" text-anchor="middle">10K</text>
<text x="296.7" y="224.3" font-size="9.5" fill="#cbbcf5" text-anchor="middle">16K</text>
<text x="370.0" y="124.0" font-size="10"  fill="#f0e6ff" font-weight="700" text-anchor="middle">90K</text>
<text x="443.3" y="170.1" font-size="9.5" fill="#cbbcf5" text-anchor="middle">56K</text>

<!-- month labels -->
<text x="76.7"  y="266" font-size="10" fill="#6f6694" text-anchor="middle">t-5</text>
<text x="150.0" y="266" font-size="10" fill="#6f6694" text-anchor="middle">t-4</text>
<text x="223.3" y="266" font-size="10" fill="#6f6694" text-anchor="middle">t-3</text>
<text x="296.7" y="266" font-size="10" fill="#6f6694" text-anchor="middle">t-2</text>
<text x="370.0" y="266" font-size="10" fill="#9f93cc" font-weight="700" text-anchor="middle">t-1</text>
<text x="443.3" y="266" font-size="10" fill="#6f6694" text-anchor="middle">t</text>

<!-- footer -->
<rect x="26" y="280" width="468" height="1" fill="#ffffff" opacity="0.06"/>
<text x="26" y="298" font-size="11" fill="#8a7fb0">🏆 <tspan fill="#c9a6ff" font-weight="700">Opus 5</tspan>  ·  94 active days  ·  busiest day 10.9K msgs  ·  244h longest run</text>
</svg>
